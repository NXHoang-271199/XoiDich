# CI/CD — same flow as yoslot: lint → test → build → deploy.
#   Merge request → lint (+ test, currently disabled — see the `test` job)
#   Push to main  → lint → build images → push to GitLab registry → deploy to the server
#
# Runs on a self-hosted runner tagged `docker` (no GitLab compute minutes used).
# CI/CD variables (Settings → CI/CD → Variables), same naming as yoslot:
#   PRODUCTION_URL              public site URL, e.g. https://xoidich.vn (API is PRODUCTION_URL/api via nginx)
#   PRODUCTION_DEPLOY_HOST      server IP / hostname
#   PRODUCTION_DEPLOY_USER      SSH user (must be able to run docker)
#   PRODUCTION_DEPLOY_PATH      folder on the server the app is deployed to
#   PRODUCTION_SSH_PRIVATE_KEY  (type File) key allowed to SSH into the server
#   PRODUCTION_ENV_FILE         (type File) apps/backend/.env for production (DB_*, REDIS_*, …),
#                               copied in before the build and baked into the backend image (like yoslot).

stages:
  - lint
  - test
  - build
  - deploy

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
  auto_cancel:
    on_new_commit: interruptible

variables:
  TZ: Asia/Ho_Chi_Minh
  HUSKY: "0"
  IMAGE_TAG: $CI_COMMIT_SHORT_SHA

# ─── Shared setup ─────────────────────────────────────────────────────────────
.node:
  image: node:24-alpine
  tags: [docker]
  interruptible: true
  cache:
    key:
      files: [pnpm-lock.yaml]
    paths: [.pnpm-store/]
  before_script:
    - corepack enable
    - pnpm config set store-dir .pnpm-store
    - pnpm install --frozen-lockfile

# ─── lint ─────────────────────────────────────────────────────────────────────
lint:
  extends: .node
  stage: lint
  script:
    - pnpm lint
    - pnpm typecheck

# ─── test ─────────────────────────────────────────────────────────────────────
test:
  extends: .node
  stage: test
  # TẠM TẮT — xoá 2 dòng `rules` bên dưới để bật lại unit + e2e test trong pipeline.
  rules:
    - when: never
  services:
    - name: postgres:17-alpine
      alias: postgres
      variables:
        POSTGRES_USER: postgres
        POSTGRES_PASSWORD: postgres
        POSTGRES_DB: xoidich_test
    - name: redis:8-alpine
      alias: redis
  variables:
    FRONTEND_URL: http://localhost:3000
    DB_HOST: postgres
    DB_DATABASE: xoidich
    DB_USERNAME: postgres
    DB_PASSWORD: postgres
    TEST_DB_DATABASE: xoidich_test
    REDIS_HOST: redis
    TEST_REDIS_DB: "1"
  script:
    - pnpm test
    - pnpm test:e2e

# ─── build ────────────────────────────────────────────────────────────────────
# Builds the two prod images once here, so the server only pulls and runs them.
build:
  stage: build
  image: docker:27
  services:
    - docker:27-dind
  tags: [docker]
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  before_script:
    - until docker info >/dev/null 2>&1; do sleep 1; done
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    - |
      build() {
        name=$1; shift
        img="$CI_REGISTRY_IMAGE/$name"
        docker pull "$img:latest" || true
        docker build --cache-from "$img:latest" --build-arg BUILDKIT_INLINE_CACHE=1 \
          -t "$img:$IMAGE_TAG" -t "$img:latest" "$@" .
        docker push "$img:$IMAGE_TAG"
        docker push "$img:latest"
      }
      cp "$PRODUCTION_ENV_FILE" apps/backend/.env
      build backend  -f docker/production/backend/Dockerfile
      build frontend -f docker/production/frontend/Dockerfile --build-arg NEXT_PUBLIC_API_URL="$PRODUCTION_URL/api"

# ─── deploy ───────────────────────────────────────────────────────────────────
# Copies docker-compose.production.yml + nginx config to the server, pulls the new
# images, runs migrations, restarts the app. No database runs in this compose, so a
# deploy can never wipe it.
deploy:
  stage: deploy
  image: alpine:3.22
  tags: [docker]
  resource_group: production
  environment:
    name: production
    url: $PRODUCTION_URL
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  variables:
    DEPLOY_HOST: $PRODUCTION_DEPLOY_HOST
    DEPLOY_USER: $PRODUCTION_DEPLOY_USER
    DEPLOY_PATH: $PRODUCTION_DEPLOY_PATH
  before_script:
    - apk add --no-cache openssh-client
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - cp "$PRODUCTION_SSH_PRIVATE_KEY" ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
    - ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts
  script:
    - SSH="ssh -i ~/.ssh/id_deploy $DEPLOY_USER@$DEPLOY_HOST"
    - $SSH "mkdir -p $DEPLOY_PATH/docker/production/nginx/certs $DEPLOY_PATH/logs"
    - scp -i ~/.ssh/id_deploy docker-compose.production.yml "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/"
    - scp -i ~/.ssh/id_deploy -r docker/production/nginx/nginx.conf docker/production/nginx/select-site.sh docker/production/nginx/sites "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/docker/production/nginx/"
    - |
      $SSH "set -e
        cd $DEPLOY_PATH
        echo '$CI_REGISTRY_PASSWORD' | docker login -u '$CI_REGISTRY_USER' --password-stdin '$CI_REGISTRY'
        export IMAGE_REGISTRY='$CI_REGISTRY_IMAGE' IMAGE_TAG='$IMAGE_TAG'
        COMPOSE='docker compose -f docker-compose.production.yml'
        \$COMPOSE pull
        # Migrations first, with the new backend image (like yoslot's php artisan migrate --force)
        \$COMPOSE run --rm --no-deps backend npx prisma migrate deploy
        \$COMPOSE up -d --remove-orphans
        for i in \$(seq 1 30); do
          \$COMPOSE exec -T backend wget -qO- http://localhost:4000/api/health && break
          [ \$i -eq 30 ] && { \$COMPOSE logs --tail 80 backend; exit 1; }
          sleep 5
        done
        docker image prune -f"
