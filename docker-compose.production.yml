# Production server: nginx → frontend / backend. No database here — like yoslot,
# the app reaches Postgres/Redis through the DB_* / REDIS_* keys of the .env baked
# into the backend image (CI writes it from PRODUCTION_ENV_FILE before building).
#
#   docker compose -f docker-compose.production.yml up -d
#
# Images are built and pushed by CI (.gitlab-ci.yml); this file only pulls and runs them.
# Migrations run in the deploy step, before `up`, with the backend image itself:
#   docker compose -f docker-compose.production.yml run --rm backend npx prisma migrate deploy
#   IMAGE_REGISTRY  e.g. registry.gitlab.com/<group>/xoidich   (CI passes it)
#   IMAGE_TAG       commit sha, or "latest"
services:
  backend:
    image: ${IMAGE_REGISTRY:-xoidich}/backend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      LOG_LEVEL: info
      LOG_DIR: /app/logs
    # Daily log files survive container restarts and are readable on the host in ./logs
    volumes:
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4000/api/health"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 30s

  frontend:
    image: ${IMAGE_REGISTRY:-xoidich}/frontend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      API_INTERNAL_URL: http://backend:4000/api
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      # 127.0.0.1, not "localhost": Next.js listens on IPv4 and alpine resolves localhost to ::1 first
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 20s

  # The only service exposed to the internet: one domain, /api → backend, / → frontend.
  # Serves HTTPS automatically once fullchain.pem + privkey.pem are put in docker/production/nginx/certs/.
  nginx:
    image: nginx:1.28-alpine
    restart: unless-stopped
    environment:
      TZ: Asia/Ho_Chi_Minh
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    volumes:
      - ./docker/production/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/production/nginx/sites:/etc/nginx/sites:ro
      - ./docker/production/nginx/select-site.sh:/docker-entrypoint.d/40-select-site.sh:ro
      - ./docker/production/nginx/certs:/etc/nginx/certs:ro
    depends_on:
      frontend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/nginx-health"]
      interval: 30s
      timeout: 5s
      retries: 3
